# Development: Postgres 18 with the planlayer and dwh databases, and the app image.
#   docker compose up --build        -> http://localhost:8000
# For backend/frontend work with reload, start only the database (docker compose up db) and run
# the backend and Vite locally (see README).
name: planlayer

# Container logs rotate at 10 MB, five files per container, so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The postgres:18 image keeps its data in a versioned directory below /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./deploy/sql/install.sql:/planlayer/install.sql:ro
      - ./deploy/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  app:
    build: .
    logging: *logging
    environment:
      PLANLAYER_ENVIRONMENT: development
      # Development only, never an installation's: the key pay is encrypted with (ADR 0029).
      PLANLAYER_PAY_KEY: cGxhbmxheWVyLWRldmVsb3BtZW50LW9ubHkta2V5ISE=
      PLANLAYER_DEMO: "true"
      PLANLAYER_APP_DATABASE_URL: postgresql+psycopg://planlayer:planlayer@db/planlayer
      PLANLAYER_SOURCE_DATABASE_URL: postgresql+psycopg://planlayer:planlayer@db/dwh
      PLANLAYER_OUTPUT_DATABASE_URL: postgresql+psycopg://planlayer:planlayer@db/dwh
    command: ["sh", "-c", "planlayer migrate && planlayer serve"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Login providers to develop against (ADR 0030), with the profile: docker compose --profile auth up -d
  # Users anna.keller, jonas.brandt, controller, admin and outsider, password planlayer-dev; see
  # docs/login.md for the settings that connect Planlayer to each.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [auth]
    logging: *logging
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for the browser and for the app: *.localhost is loopback to browsers and
      # the host, and an alias of this container inside the compose network.
      KC_HOSTNAME: http://kc.localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases: [kc.localhost]

  lldap:
    image: lldap/lldap:v0.6.3
    profiles: [auth]
    logging: *logging
    environment:
      LLDAP_LDAP_BASE_DN: dc=nordwerk,dc=example
      # The directory's own admin, apart from the test users (one of them is called admin).
      LLDAP_LDAP_USER_DN: lldap-admin
      LLDAP_LDAP_USER_PASS: lldap-admin-dev
      LLDAP_JWT_SECRET: development-only-not-a-secret
      LLDAP_KEY_SEED: development-only-not-a-seed
    ports:
      - "127.0.0.1:3890:3890"   # LDAP
      - "127.0.0.1:17170:17170" # web UI
    volumes:
      - ./deploy/dev/lldap:/bootstrap:ro

  # A production-like installation to log in with Microsoft Entra ID (docs/entra-id.md), with the
  # profile: docker compose --profile entra up -d --build app-entra, then http://localhost:8001.
  # Its own database planlayer_entra, created once by entra-db as a DBA would; no demo login; the
  # values from deploy/dev/entra.env (copied from entra.env.example).
  entra-db:
    image: postgres:18
    profiles: [entra]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./deploy/sql/install.sql:/planlayer/install.sql:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'planlayer_entra'")" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE planlayer_entra"
          psql -v ON_ERROR_STOP=1 -d planlayer_entra -c "CREATE SCHEMA gold"
          psql -v ON_ERROR_STOP=1 -v app_db=planlayer_entra -v output_db=planlayer_entra \
               -v source_db=planlayer_entra -v source_schema=gold -v app_role=planlayer_entra \
               -v bi_role=planlayer_entra_bi -v app_password=planlayer_entra -f /planlayer/install.sql
        fi
    depends_on:
      db:
        condition: service_healthy

  app-entra:
    build: .
    profiles: [entra]
    logging: *logging
    environment:
      # Development: plain-http cookies on localhost.
      PLANLAYER_ENVIRONMENT: development
      # Development only, never an installation's: the key pay is encrypted with (ADR 0029).
      PLANLAYER_PAY_KEY: cGxhbmxheWVyLWRldmVsb3BtZW50LW9ubHkta2V5ISE=
      PLANLAYER_APP_DATABASE_URL: postgresql+psycopg://planlayer_entra:planlayer_entra@db/planlayer_entra
      # The address of the redirect URI registered in Entra ID.
      PLANLAYER_PUBLIC_URL: http://localhost:8001
    env_file:
      - path: ./deploy/dev/entra.env
        required: true
    command: ["sh", "-c", "planlayer migrate && planlayer serve"]
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      entra-db:
        condition: service_completed_successfully

  # The same for Okta (docs/okta.md): docker compose --profile okta up -d --build app-okta, then
  # http://localhost:8002. Database planlayer_okta; the values from deploy/dev/okta.env.
  okta-db:
    image: postgres:18
    profiles: [okta]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./deploy/sql/install.sql:/planlayer/install.sql:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'planlayer_okta'")" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE planlayer_okta"
          psql -v ON_ERROR_STOP=1 -d planlayer_okta -c "CREATE SCHEMA gold"
          psql -v ON_ERROR_STOP=1 -v app_db=planlayer_okta -v output_db=planlayer_okta \
               -v source_db=planlayer_okta -v source_schema=gold -v app_role=planlayer_okta \
               -v bi_role=planlayer_okta_bi -v app_password=planlayer_okta -f /planlayer/install.sql
        fi
    depends_on:
      db:
        condition: service_healthy

  app-okta:
    build: .
    profiles: [okta]
    logging: *logging
    environment:
      # Development: plain-http cookies on localhost.
      PLANLAYER_ENVIRONMENT: development
      # Development only, never an installation's: the key pay is encrypted with (ADR 0029).
      PLANLAYER_PAY_KEY: cGxhbmxheWVyLWRldmVsb3BtZW50LW9ubHkta2V5ISE=
      PLANLAYER_APP_DATABASE_URL: postgresql+psycopg://planlayer_okta:planlayer_okta@db/planlayer_okta
      # The address of the redirect URI registered in Okta.
      PLANLAYER_PUBLIC_URL: http://localhost:8002
    env_file:
      - path: ./deploy/dev/okta.env
        required: true
    command: ["sh", "-c", "planlayer migrate && planlayer serve"]
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      okta-db:
        condition: service_completed_successfully

  # The same for Google Workspace (docs/google-workspace.md): docker compose --profile google up
  # -d --build app-google, then http://localhost:8003. Database planlayer_google; the values from
  # deploy/dev/google.env.
  google-db:
    image: postgres:18
    profiles: [google]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./deploy/sql/install.sql:/planlayer/install.sql:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'planlayer_google'")" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE planlayer_google"
          psql -v ON_ERROR_STOP=1 -d planlayer_google -c "CREATE SCHEMA gold"
          psql -v ON_ERROR_STOP=1 -v app_db=planlayer_google -v output_db=planlayer_google \
               -v source_db=planlayer_google -v source_schema=gold -v app_role=planlayer_google \
               -v bi_role=planlayer_google_bi -v app_password=planlayer_google -f /planlayer/install.sql
        fi
    depends_on:
      db:
        condition: service_healthy

  app-google:
    build: .
    profiles: [google]
    logging: *logging
    environment:
      # Development: plain-http cookies on localhost.
      PLANLAYER_ENVIRONMENT: development
      # Development only, never an installation's: the key pay is encrypted with (ADR 0029).
      PLANLAYER_PAY_KEY: cGxhbmxheWVyLWRldmVsb3BtZW50LW9ubHkta2V5ISE=
      PLANLAYER_APP_DATABASE_URL: postgresql+psycopg://planlayer_google:planlayer_google@db/planlayer_google
      # The address of the redirect URI registered at Google.
      PLANLAYER_PUBLIC_URL: http://localhost:8003
    env_file:
      - path: ./deploy/dev/google.env
        required: true
    command: ["sh", "-c", "planlayer migrate && planlayer serve"]
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      google-db:
        condition: service_completed_successfully

volumes:
  pgdata:
