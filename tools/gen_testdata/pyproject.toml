[project]
name = "gen-testdata"
version = "0.1.0"
description = "Deterministic Nordwerk test data for Planlayer"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Loading via COPY.
    "psycopg[binary]==3.3.8",
    # Parquet export of the gold views; Arrow is also the adapters' interchange format (D-10).
    "pyarrow==26.0.1",
]

[project.scripts]
gen-testdata = "gen_testdata.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["gen_testdata"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
