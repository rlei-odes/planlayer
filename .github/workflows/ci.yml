name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PLANLAYER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # pg_dump and pg_restore 18 for the backup tests (ADR 0032); the runner's own are older.
      - name: Postgres 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      # The DBA path (D-25): install script, then migrate and serve as the unprivileged app role,
      # with the app store and the warehouse in separate databases (T-14).
      - name: Install script and migration as the app role
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE planlayer" -c "CREATE DATABASE dwh"
          psql -v ON_ERROR_STOP=1 -d dwh -c "CREATE SCHEMA gold"
          psql -v app_db=planlayer -v output_db=dwh -v source_db=dwh -v source_schema=gold \
               -v app_password=planlayer -v backup_password=backup -f ../deploy/sql/install.sql
          export PLANLAYER_APP_DATABASE_URL=postgresql+psycopg://planlayer:planlayer@localhost/planlayer
          export PLANLAYER_OUTPUT_DATABASE_URL=postgresql+psycopg://planlayer:planlayer@localhost/dwh
          export PLANLAYER_SOURCE_DATABASE_URL=postgresql+psycopg://planlayer:planlayer@localhost/dwh
          .venv/bin/planlayer migrate
          # Started from the venv, not via `uv run`: a uv process left running holds uv's cache
          # lock, and the setup-uv post step then times out.
          .venv/bin/planlayer serve --port 8000 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 30); do curl -sf localhost:8000/api/health > health.json && break; sleep 1; done
          cat health.json
          head=$(.venv/bin/python -c "from planlayer.store.migrate import head_revision; print(head_revision())")
          grep -q "\"schema_revision\":\"$head\"" health.json
          # The backup role the install script created reads the whole app store.
          PLANLAYER_BACKUP_DATABASE_URL=postgresql://planlayer_backup:backup@localhost/planlayer \
          PLANLAYER_BACKUP_DIR="$RUNNER_TEMP/backups" .venv/bin/planlayer backup

  testdata:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      PLANLAYER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: tools/gen_testdata
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t planlayer:ci .
