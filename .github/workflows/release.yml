name: Release

# For a version tag (v0.5.0), called by release-please.yml when its release PR is merged, or on a
# tag pushed by hand: the image for amd64 and arm64 on GHCR as 0.5.0, 0.5 and latest, with
# an SBOM and build provenance attached, signed keyless with cosign (ADR 0031). Mirrored to
# Docker Hub when the repository variable DOCKERHUB_IMAGE is set (e.g. planlayer/planlayer),
# with the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to build, e.g. v0.6.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign's keyless signature (Sigstore, GitHub's OIDC token)
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The tag is the version the backend declares; a mismatch is a tag on the wrong commit.
      - name: Tag matches the version
        run: |
          declared=$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)
          if [ "v$declared" != "$TAG" ]; then
            echo "::error::tag $TAG, backend/pyproject.toml declares $declared"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The registries to push to, one per line: metadata-action refuses an empty name, even
      # disabled, so Docker Hub is listed only when it is set.
      - id: images
        run: |
          {
            echo "list<<EOF"
            echo "$GHCR_IMAGE"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # 0.5.0, 0.5 and latest; a pre-release (v1.0.0-rc.1) gets only its own tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          flavor: |
            latest=auto

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # One signature per registry, on the digest: it covers every tag and both platforms.
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          if [ -n "$DOCKERHUB_IMAGE" ]; then cosign sign --yes "$DOCKERHUB_IMAGE@$DIGEST"; fi
