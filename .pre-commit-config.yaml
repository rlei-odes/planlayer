# pre-commit install  (once per clone)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: sh -c 'cd frontend && npx oxlint --deny-warnings'
        language: system
        files: ^frontend/src/
        pass_filenames: false
